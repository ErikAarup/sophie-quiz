<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR · Sofies topp tio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    /* Print page: white paper, black code. Deliberately not the dark game theme. */
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #0a0b10; font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; }
    .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 40px 24px; text-align: center; }
    .eyebrow { font-size: 16px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #555c70; }
    h1 { font-family: 'Bebas Neue', 'Arial Narrow', Impact, sans-serif; font-weight: 400; font-size: 96px; line-height: 0.95; margin: 0; letter-spacing: 0.02em; }
    #qr { width: min(70vw, 520px); height: min(70vw, 520px); }
    #qr svg { width: 100%; height: 100%; display: block; }
    .url { font-size: 22px; font-weight: 500; word-break: break-all; }
    .how { font-size: 18px; color: #333a4d; max-width: 520px; }
    .tip { font-size: 14px; color: #8a90a6; }
    @media print { .tip { display: none; } .page { min-height: auto; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="eyebrow">Sofie 25 år</div>
    <h1>Topp<br>tio</h1>
    <div id="qr" aria-label="QR-kod till quizet"></div>
    <div class="url" id="url"></div>
    <div class="how">Skanna med kameran. Välj ert lag. En telefon per lag.</div>
    <div class="tip">Skriv ut den här sidan (Ctrl/Cmd + P). Lägg till <code>?u=https://…</code> för att koda en annan adress.</div>
  </div>
  <script type="module" src="/assets/qr.js"></script>
</body>
</html>
