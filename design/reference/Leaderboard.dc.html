<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #0a0b10; color: #f2f3f7; font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }
    a { color: #d8ff3d; } a:hover { color: #eaff85; }
    .phone { width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 60% at 50% -10%, #1a1f33 0%, #0a0b10 60%); position: relative; overflow: hidden; }
    .display { font-family: "Bebas Neue", "Arial Narrow", Impact, sans-serif; letter-spacing: 0.02em; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8a90a6; }
    .btn { display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; font-weight: 600; font-size: 17px; }
    .btn-primary { background: #d8ff3d; color: #0a0b10; }
    .btn-ghost { background: #171a26; color: #f2f3f7; border: 1px solid #2a2f44; }
    .btn-danger { background: #2a1420; color: #ff6b8a; border: 1px solid #4a1f30; }
    .pill { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 999px; background: #171a26; border: 1px solid #2a2f44; font-size: 13px; font-weight: 500; color: #c9cddb; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d8ff3d; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #12141d; border: 1px solid #1f2333; }
    .rank { width: 40px; font-size: 30px; line-height: 1; color: #8a90a6; text-align: center; }
    .muted { color: #8a90a6; }
    .tag { font-family: "IBM Plex Sans", sans-serif; font-size: 12px; letter-spacing: 0.1em; color: #8a90a6; }
  </style>
</helmet>
<div class="phone" style="display: flex; flex-direction: column; padding: 56px 24px 32px 24px; gap: 20px;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div class="pill"><span class="dot"></span>Lag 3</div>
    <div class="eyebrow">Efter fråga 4</div>
  </div>
  <div class="display" style="font-size: 56px; line-height: 0.95;">Ställning</div>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div class="row"><div class="rank display" style="color: #d8ff3d;">1</div><div style="flex-grow: 1; font-size: 18px; font-weight: 600;">Lag 7</div><div class="display" style="font-size: 30px; line-height: 1;">27</div></div>
    <div class="row"><div class="rank display">2</div><div style="flex-grow: 1; font-size: 18px; font-weight: 600;">Lag 1</div><div class="display" style="font-size: 30px; line-height: 1;">24</div></div>
    <div class="row" style="background: #1c2210; border-color: #d8ff3d;"><div class="rank display" style="color: #d8ff3d;">3</div><div style="flex-grow: 1; font-size: 18px; font-weight: 600; color: #d8ff3d;">Lag 3 · ni</div><div class="display" style="font-size: 30px; line-height: 1; color: #d8ff3d;">22</div></div>
    <div class="row"><div class="rank display">4</div><div style="flex-grow: 1; font-size: 18px; font-weight: 600;">Lag 5</div><div class="display" style="font-size: 30px; line-height: 1;">19</div></div>
    <div class="row"><div class="rank display">5</div><div style="flex-grow: 1; font-size: 18px; font-weight: 600;">Lag 2</div><div class="display" style="font-size: 30px; line-height: 1;">17</div></div>
    <div class="row"><div class="rank display">6</div><div style="flex-grow: 1; font-size: 18px; font-weight: 600;">Lag 8</div><div class="display" style="font-size: 30px; line-height: 1;">15</div></div>
    <div class="row"><div class="rank display">7</div><div style="flex-grow: 1; font-size: 18px; font-weight: 600;">Lag 4</div><div class="display" style="font-size: 30px; line-height: 1;">12</div></div>
    <div class="row"><div class="rank display">8</div><div style="flex-grow: 1; font-size: 18px; font-weight: 600;">Lag 6</div><div class="display" style="font-size: 30px; line-height: 1;">9</div></div>
  </div>
  <div style="margin-top: auto; font-size: 14px; color: #8a90a6; text-align: center;">Senaste: Portugal, plats 10, +10 poäng</div>
</div>
</x-dc>
</body>
</html>
