<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #0a0b10; color: #f2f3f7; font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }
    a { color: #d8ff3d; } a:hover { color: #eaff85; }
    .phone { width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 60% at 50% -10%, #1a1f33 0%, #0a0b10 60%); position: relative; overflow: hidden; }
    .display { font-family: "Bebas Neue", "Arial Narrow", Impact, sans-serif; letter-spacing: 0.02em; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8a90a6; }
    .btn { display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; font-weight: 600; font-size: 17px; }
    .btn-primary { background: #d8ff3d; color: #0a0b10; }
    .btn-ghost { background: #171a26; color: #f2f3f7; border: 1px solid #2a2f44; }
    .btn-danger { background: #2a1420; color: #ff6b8a; border: 1px solid #4a1f30; }
    .pill { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 999px; background: #171a26; border: 1px solid #2a2f44; font-size: 13px; font-weight: 500; color: #c9cddb; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d8ff3d; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #12141d; border: 1px solid #1f2333; }
    .rank { width: 40px; font-size: 30px; line-height: 1; color: #8a90a6; text-align: center; }
    .muted { color: #8a90a6; }
    .tag { font-family: "IBM Plex Sans", sans-serif; font-size: 12px; letter-spacing: 0.1em; color: #8a90a6; }
  </style>
</helmet>
<div class="phone" style="display: flex; flex-direction: column; padding: 56px 24px 32px 24px; gap: 16px;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div class="pill"><span class="dot"></span>Lag 3</div>
    <div class="eyebrow">Fråga 4 av 10</div>
  </div>
  <div style="font-size: 18px; font-weight: 600; line-height: 1.3;">EU:s folkrikaste länder</div>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div class="row"><div class="rank display">1</div><div style="flex-grow: 1; font-size: 17px;">Tyskland</div><div class="muted" style="font-size: 13px;">83,6 milj</div></div>
    <div class="row"><div class="rank display">2</div><div style="flex-grow: 1; font-size: 17px;">Frankrike</div><div class="muted" style="font-size: 13px;">68,6 milj</div></div>
    <div class="row"><div class="rank display">3</div><div style="flex-grow: 1; font-size: 17px;">Italien</div><div class="muted" style="font-size: 13px;">58,9 milj</div></div>
    <div class="row"><div class="rank display">4</div><div style="flex-grow: 1; font-size: 17px;">Spanien</div><div class="muted" style="font-size: 13px;">49,1 milj</div></div>
    <div class="row"><div class="rank display">5</div><div style="flex-grow: 1; font-size: 17px;">Polen</div><div class="muted" style="font-size: 13px;">36,5 milj</div></div>
    <div class="row"><div class="rank display">6</div><div style="flex-grow: 1; font-size: 17px;">Rumänien</div><div class="muted" style="font-size: 13px;">19,0 milj</div></div>
    <div class="row" style="opacity: 0.4;"><div class="rank display">7</div><div style="flex-grow: 1; font-size: 17px;">·····</div></div>
    <div class="row" style="opacity: 0.4;"><div class="rank display">8</div><div style="flex-grow: 1; font-size: 17px;">·····</div></div>
    <div class="row" style="opacity: 0.4;"><div class="rank display">9</div><div style="flex-grow: 1; font-size: 17px;">·····</div></div>
    <div class="row" style="opacity: 0.4;"><div class="rank display">10</div><div style="flex-grow: 1; font-size: 17px;">·····</div></div>
  </div>
  <div style="margin-top: auto; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: #1c2210; border: 1px solid #d8ff3d;">
    <div class="display" style="font-size: 44px; line-height: 1; color: #d8ff3d;">?</div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 15px; font-weight: 600;">Ert svar: Portugal</div>
      <div class="muted" style="font-size: 13px;">Inte avslöjat än. Håll tummarna.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
